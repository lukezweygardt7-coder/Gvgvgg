name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      # Finds the project automatically: repo root, a subfolder, or any .zip you uploaded
      - name: Locate project
        run: |
          if [ ! -f build.gradle ]; then
            for z in *.zip; do
              [ -f "$z" ] && unzip -oq "$z" -d "_unzipped/${z%.zip}"
            done
          fi
          FILE=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error title=Project files missing::No build.gradle found in the repo. Files in repo root: $(ls -A | tr '\n' ' ')"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle build --no-daemon > build.log 2>&1 || {
            MSG=$(grep -A 15 -E 'What went wrong|error:' build.log | head -30 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed - the cause::$MSG"
            tail -40 build.log
            exit 1
          }
          tail -5 build.log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: shototo-shotgun-mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
